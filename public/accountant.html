<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شهم | المحاسب</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell">
<header><div><b>شهم</b><span>لوحة المحاسب</span></div></header>
<section id="loginCard" class="grid"><article><h2>تسجيل دخول المحاسب</h2><label>رقم الهاتف<small class="hint">سجل رقمك بدون صفر</small><input id="phone" inputmode="tel"></label><label>كلمة المرور<input id="password" type="password"></label><button id="login">دخول</button><p id="loginMsg"></p></article></section>
<section id="panel" class="grid" hidden>
<article class="wide"><div class="card-head"><span><h2 id="accName"></h2><small id="accIdentity"></small></span><button id="logout">تسجيل الخروج</button></div><div class="captain-card"><div class="card-head"><b>محفظة المحاسب</b><strong id="accBalance"></strong></div></div><div class="stats"><span>🚶 عدد الركاب <b id="tPassengers">0</b></span><span>📦 عدد الأوردرات <b id="tOrders">0</b></span><span>⭐ عمولات خاصة <b id="tSpecial">0</b></span></div></article>
<article><h2>إرسال رصيد للكابتن</h2><div class="row"><label>رقم الكابتن<small class="hint">سجل رقمه بدون صفر — يظهر رصيده بعد الكتابة</small><input id="sendPhone" inputmode="tel" oninput="checkBalance(this.value)"></label><label>المبلغ<input id="sendAmount" type="number" min=".01" step=".01"></label></div><p class="hint" id="sendBalanceInfo" hidden></p><button id="sendBalance">إرسال الرصيد</button><p id="sendMsg"></p></article>
<article><h2>إزالة عضو من الجروب</h2><label>رقم الهاتف<small class="hint">سجل رقمه بدون صفر</small><input id="rmPhone" inputmode="tel"></label><button id="removeBtn">إزالة من الجروب</button><p id="removeMsg"></p></article>
<article class="wide"><h2>تسجيل عمولة: مستهلك ← منتج</h2><p class="hint">يُخصم الإجمالي من المستهلك ويُضاف تلقائيًا للمنتج المرتبط به. لا يوجد إنتاج منفرد.</p><div class="row"><label>رقم المستهلك<small class="hint">سجل رقمه بدون صفر</small><input id="entryPhone" inputmode="tel"></label><label>نوع العملية<select id="entryCategory"><option value="passengers">راكب</option><option value="orders">أوردر</option><option value="special">عمولة خاصة</option></select></label><label>العدد<input id="entryQuantity" type="number" min="1" step="1" value="1"></label><label>قيمة الوحدة<input id="entryUnit" type="number" min=".01" step=".01"></label></div><p id="entryTotal" class="hint">الإجمالي: 0.00 د.أ</p><button id="addEntry">تسجيل العملية</button><p id="entryMsg"></p></article>
<article class="wide"><h2>المستهلكون</h2><div id="consumers"></div></article><article class="wide"><h2>المنتجون</h2><div id="products"></div></article>
</section></main><script src="/accountant.js"></script></body></html>
