<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ربط واتساب مع شهم</title>
<style>
  body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 40px 20px; }
  h1 { color: #22c55e; }
  .card { background: #1e293b; max-width: 640px; margin: 0 auto; padding: 30px; border-radius: 16px; }
  pre { background: #fff; padding: 20px; border-radius: 12px; overflow-x: auto; font-size: 8px; line-height: 1.1; }
  .status { font-size: 20px; margin-top: 20px; }
  .ok { color: #22c55e; } .wait { color: #facc15; }
  button { background: #22c55e; color: #fff; border: 0; padding: 14px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 15px; }
  small { color: #94a3b8; display: block; margin-top: 15px; }
</style>
</head>

<body>
<div class="card">
 <h1>📱 ربط واتساب مع شهم</h1>
 <p>افتح واتساب بالجوال ← الإعدادات ← الأجهزة المرتبطة ← ربط جهاز ← امسح الرمز</p>
 <div id="qr">جاري جلب رمز QR...</div>
 <div class="status wait" id="status">بانتظار المسح...</div>
 <button onclick="location.reload()">🔄 تحديث الرمز</button>
 <small>الرمز ثابت — اضغط «تحديث الرمز» عند الحاجة</small>
</div>
<script>
let done = false;
async function tick() {
  if (done) return;
  try {
    const r = await fetch('/api/qr-status');
    const d = await r.json();
    if (d.connected) {
      done = true;
      document.getElementById('qr').innerHTML = '<h2>✅</h2>';
      const st = document.getElementById('status');
      st.textContent = '✅ واتساب متصل! كل شي تمام';
      st.className = 'status ok';
      return;
    }
    if (d.qr) document.getElementById('qr').innerHTML = '<img src="/api/qr-image?' + Date.now() + '" width="320" height="320" style="border-radius:12px;background:#fff;padding:10px">';
    else document.getElementById('qr').textContent = 'بانتظار توليد الرمز...';
  } catch (e) { document.getElementById('qr').textContent = 'تعذر الاتصال — أعد المحاولة'; }
}
// الرمز ثابت — التحديث يدوي بزر «تحديث الرمز».
// نعرض الرمز مرة واحدة عند الفتح، ونراقب حالة الاتصال فقط بالخلفية.
tick();
setInterval(() => { if (!done) tick(); }, 3000);
</script>
</body>

</html>
