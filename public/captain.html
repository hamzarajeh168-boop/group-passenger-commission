<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>شهم - صفحة الكابتن</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="shell">
        <header>
            <div><b>شهم</b><span>صفحة الكابتن</span></div><a href="/">غرفة الإدارة</a>
        </header>
        <section class="hero">
            <div class="road"></div>
            <div id="car">🚕</div>
            <h1>بطاقتي</h1>
            <p>رصيدك وعمولاتك في أي وقت</p>
        </section>

        <section class="grid" id="loginCard">
            <article>
                <h2>دخول الكابتن</h2>
                <p class="hint">الدخول برقم الهاتف وكلمة السر (تُنشأ من الإدارة فقط)</p><label>رقم الهاتف<input
                        id="phone"></label><label>كلمة السر<input id="password" type="password"></label><button
                    id="login">دخول</button>
                <p id="loginMsg"></p>
            </article>
        </section>

        <section class="grid" id="panel" hidden>
            <article class="wide">
                <div class="card-head"><span>
                        <h2 id="capName"></h2><small id="capIdentity"></small>
                    </span><button id="logout">تسجيل خروج</button></div>
                <div class="captain-card">
                    <div class="card-head"><span><b>الرصيد الحالي</b><small id="capStatus"></small></span><strong
                            id="balance"></strong></div>
                    <div class="stats"><span>🚶 راكب <b id="passengers"></b></span><span>📦 أوردر <b
                                id="orders"></b></span><span>🤝 المرتبط <b id="linked"></b></span></div>
                    <p class="hint" id="zeroWarn" hidden>⚠️ رصيدك صفر — ممنوع الكتابة في جروب الواتساب. لازم تشحن بحد
                        أدنى 10 دنانير.</p>
                </div>
            </article>
            <article class="wide">
                <h2>سجل الجرد</h2>
                <div id="ledger"></div>
            </article>
        </section>
    </main>
    <script src="/captain.js"></script>
</body>

</html>
